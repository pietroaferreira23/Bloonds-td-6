name: Build Defensores do Vale (diagnostico)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Gerar executavel com janela de diagnostico
    runs-on: windows-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Verificar arquivo do jogo
        shell: pwsh
        run: |
          if (-not (Test-Path "jogo.py")) {
            Write-Error "O arquivo jogo.py nao foi encontrado na raiz do repositorio."
            exit 1
          }

      - name: Gerar executavel (mostrar erros ao abrir)
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --collect-all pygame --name DefensoresDoVale jogo.py

      - name: Enviar executavel para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Defensores-do-Vale-Windows-Diagnostico
          path: dist/DefensoresDoVale.exe
          if-no-files-found: error
          retention-days: 14

name: Build Defensores do Vale

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Gerar executavel para Windows
    runs-on: windows-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Conferir arquivo principal
        shell: pwsh
        run: |
          if (-not (Test-Path "main.py")) {
            Write-Error "O arquivo main.py nao foi encontrado na raiz do repositorio. Salve o codigo completo do jogo nesse arquivo."
            exit 1
          }

      - name: Gerar executavel
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DefensoresDoVale main.py

      - name: Enviar executavel para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Defensores-do-Vale-Windows
          path: dist/DefensoresDoVale.exe
          if-no-files-found: error
          retention-days: 14
